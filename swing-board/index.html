<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스윙 현황판</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#14171c;--sub:#5d6573;--line:#e6e8ec;
  --up:#d63b3b;--down:#2563c9;--win:#d63b3b;--loss:#2563c9;--flat:#7a808a;--new:#0f8a5f;--warn:#b7791f;
  --chip:#f0f2f5;--accent:#14171c;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#171a20;--ink:#eef0f3;--sub:#9aa2ae;--line:#262a32;
  --up:#ff6b6b;--down:#5b9dff;--win:#ff6b6b;--loss:#5b9dff;--flat:#9aa2ae;--new:#34c38f;--warn:#e0a83a;
  --chip:#20242c;--accent:#eef0f3;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
.meta{color:var(--sub);font-size:12px;text-align:right}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;border-radius:12px;font-size:15px;font-weight:600}
.tab[aria-selected="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 8px}
.small{font-size:12.5px;color:var(--sub)}
.lead{margin:0;padding:0;list-style:none}
.lead li{padding:7px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.lead li:first-child{border-top:0}
.lead .k{flex:0 0 92px;font-weight:700;font-size:14px}
.lead .v{flex:1;font-size:14.5px}
.stock{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line)}
.stock:first-of-type{border-top:0}
.nm{font-weight:650;font-size:15.5px}
.nm .cd{color:var(--sub);font-weight:400;font-size:12px;margin-left:4px}
.px{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.dt{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.rt{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);margin-top:4px}
.t-win,.t-hold-up{color:var(--win)}.t-loss,.t-hold-down{color:var(--loss)}.t-flat,.t-done,.t-hold{color:var(--flat)}.t-new{color:var(--new)}.t-warn{color:var(--warn)}
.b-win{background:color-mix(in srgb,var(--win) 14%,transparent);color:var(--win)}
.b-loss{background:color-mix(in srgb,var(--loss) 14%,transparent);color:var(--loss)}
.b-new{background:color-mix(in srgb,var(--new) 14%,transparent);color:var(--new)}
.b-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.up{color:var(--up)}.down{color:var(--down)}
.empty{color:var(--sub);padding:6px 0}
details summary{cursor:pointer;color:var(--sub);font-size:13px}
pre{white-space:pre-wrap;font:13px/1.55 inherit;margin:8px 0 0;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:var(--chip);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--sub)}
.warnbox{font-size:12.5px;color:var(--sub);text-align:center;margin-top:18px}
.err{color:var(--loss)}
button.ref{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:4px 10px;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📈 스윙 현황판</h1>
    <div class="meta"><div id="upd">불러오는 중…</div><button class="ref" onclick="load()">새로고침</button></div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="kr" aria-selected="true">🇰🇷 한국</button>
    <button class="tab" role="tab" data-t="us" aria-selected="false">🇺🇸 미국</button>
  </div>
  <main id="app"><div class="card empty">시세를 불러오는 중이에요…</div></main>
  <p class="warnbox">모두 가상매매 기록이에요. 실제 주문은 없고, 투자 판단의 책임은 본인에게 있어요.</p>
</div>
<script>
let DATA=null, TAB="kr";
try{TAB=localStorage.getItem("tab")||"kr"}catch(e){}
const $=s=>document.querySelector(s);
const pct=(v,d=1)=>v==null||isNaN(v)?"-":(v>0?"+":"")+(v*100).toFixed(d)+"%";
const pctRaw=(v,d=2)=>v==null||isNaN(v)?"":(v>0?"+":"")+Number(v).toFixed(d)+"%";
const cls=v=>v>0?"up":v<0?"down":"";
const won=v=>v==null?"-":Math.round(v).toLocaleString("ko-KR")+"원";
const usd=v=>v==null?"-":"$"+Number(v).toFixed(2);
const md=s=>s?s.slice(5).replace("-","/"):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge=(act,tone)=>`<span class="badge b-${tone}">${esc(act)}</span>`;

function leadList(groups){
  const order=[["🟢 신규 편입","new"],["💰 익절 매도","win"],["🔻 손절 매도","loss"],["⚪ 보합 정리","flat"],["⏰ 매도 예정","warn"],["🔵 계속 보유","hold"]];
  const items=order.filter(([k])=>groups[k]&&groups[k].length).map(([k,t])=>`<li><span class="k t-${t}">${k}</span><span class="v">${groups[k].join(", ")}</span></li>`);
  return items.length?`<ul class="lead">${items.join("")}</ul>`:`<div class="empty">오늘 할 일 없음</div>`;
}
function bucket(act){
  if(act.includes("신규"))return "🟢 신규 편입";
  if(act.includes("익절"))return "💰 익절 매도";
  if(act.includes("손절"))return "🔻 손절 매도";
  if(act.includes("보합"))return "⚪ 보합 정리";
  if(act.includes("다음")||act.includes("만료분"))return "⏰ 매도 예정";
  if(act.includes("보유"))return "🔵 계속 보유";
  return null;
}

function renderKR(k){
  const open=k.rows.filter(r=>!r.done), done=k.rows.filter(r=>r.done);
  const g={};
  for(const r of open){const b=bucket(r.act); if(b)(g[b]=g[b]||[]).push(`${esc(r.name)} <span class="${cls(r.ret)}">${pct(r.ret)}</span>`);}
  const status=k.sessionOpen?"장중 실시간":"장 마감 기준";
  let h=`<section class="card"><h2>오늘의 리딩 <span class="small">· ${status}</span></h2>${k.regime?`<div class="small" style="margin-bottom:6px">${esc(k.regime)}</div>`:""}${leadList(g)}
  <div class="small" style="margin-top:8px">매수는 15:20 동시호가 전 종가 매수, 매도는 5거래일째 종가. 손절 -7%는 미리 걸어 두기.</div></section>`;
  h+=`<section class="card"><h2>보유 종목 (${open.length}/${k.slots})</h2>`;
  if(!open.length)h+=`<div class="empty">보유 종목 없음. ${esc(k.schedule)}</div>`;
  for(const r of open){
    h+=`<div class="stock"><div><div class="nm">${esc(r.name)}<span class="cd">${r.code}</span></div>
      <div class="dt">${md(r.date)} 매수 ${won(r.entry)} · 손절 ${won(r.stop)} · ${r.day}/${r.hold}일째</div>${badge(r.act,r.tone)}</div>
      <div><div class="px">${won(r.price)}</div><div class="rt ${cls(r.chgPct)}">오늘 ${pctRaw(r.chgPct)}</div><div class="rt ${cls(r.ret)}"><b>${pct(r.ret)}</b></div></div></div>`;
  }
  h+=`</section>`;
  const closed=(k.closed||[]);
  if(k.stats){const s=k.stats;h+=`<section class="card"><h2>누적 성적</h2><div class="stats"><div class="stat"><b>${s.n}건</b><span>청산</span></div><div class="stat"><b>${(s.win*100).toFixed(0)}%</b><span>승률</span></div><div class="stat"><b class="${cls(s.avg)}">${pct(s.avg,2)}</b><span>건당 평균</span></div></div><div class="small" style="margin-top:6px">10종목 계좌 기준 누적 <span class="${cls(s.acct)}">${pct(s.acct)}</span> (비용 0.25% 차감)</div></section>`;}
  if(closed.length){h+=`<section class="card"><h2>최근 청산</h2>`;for(const c of closed.slice(0,15)){h+=`<div class="stock"><div><div class="nm">${esc(c.name)}</div><div class="dt">${md(c.date)} ${won(c.entry)} → ${md(c.exit_date)} ${won(c.exit_price)} · ${esc(c.reason||"")}</div></div><div class="rt ${cls(c.ret_net)}"><b>${pct(c.ret_net)}</b></div></div>`;}h+=`</section>`;}
  if(k.legacy_note)h+=`<section class="card"><details><summary>이전 단타(+2% 익절) 기록 보기</summary><pre>${esc(k.legacy_note)}</pre></details></section>`;
  h+=`<section class="card"><h2>규칙</h2><div class="small">${esc(k.rule)}<br>${esc(k.schedule)}</div></section>`;
  return h;
}

function renderUS(u){
  const live=u.tickers.filter(t=>t.openLots>0).sort((a,b)=>(b.inToday-a.inToday)||((b.avgRet||0)-(a.avgRet||0)));
  const g={};
  for(const t of live){const b=bucket(t.act); if(b)(g[b]=g[b]||[]).push(`${esc(t.code)} <span class="${cls(t.avgRet)}">${pct(t.avgRet)}</span>`);}
  const status=u.sessionOpen?"장중 실시간":"장 마감 기준";
  let h=`<section class="card"><h2>오늘의 리딩 <span class="small">· ${status} · 추천일 ${md(u.asof)}</span></h2>${u.market?`<div class="small" style="margin-bottom:6px">${esc(u.market)}</div>`:""}${leadList(g)}
  <div class="small" style="margin-top:8px">매일 상위 5종목을 종가에 사고, 각 묶음은 3거래일째 종가에 팔아요. 오늘도 상위 5에 있으면 사실상 계속 보유예요.</div></section>`;
  h+=`<section class="card"><h2>보유 종목 (${live.length}종목 · ${u.rows.filter(r=>!r.done).length}묶음)</h2>`;
  if(!live.length)h+=`<div class="empty">보유 종목 없음</div>`;
  for(const t of live){
    const lots=t.lots.filter(x=>!x.done).map(x=>`${md(x.date)} ${usd(x.entry)} <span class="${cls(x.ret)}">${pct(x.ret)}</span> · ${x.day}/${x.hold}일`).join("<br>");
    h+=`<div class="stock"><div><div class="nm">${esc(t.name)}<span class="cd">${t.code}</span></div><div class="dt">${lots}</div>${badge(t.act,t.tone)}</div>
      <div><div class="px">${usd(t.price)}</div><div class="rt ${cls(t.chgPct)}">오늘 ${pctRaw(t.chgPct)}</div><div class="rt ${cls(t.avgRet)}"><b>${pct(t.avgRet)}</b></div></div></div>`;
  }
  h+=`</section>`;
  const done=u.rows.filter(r=>r.done).sort((a,b)=>(b.exitDate||"").localeCompare(a.exitDate||""));
  if(done.length){
    const n=done.length,avg=done.reduce((s,r)=>s+r.ret,0)/n,win=done.filter(r=>r.ret>0).length/n;
    h+=`<section class="card"><h2>누적 성적</h2><div class="stats"><div class="stat"><b>${n}건</b><span>청산</span></div><div class="stat"><b>${(win*100).toFixed(0)}%</b><span>승률</span></div><div class="stat"><b class="${cls(avg)}">${pct(avg,2)}</b><span>건당 평균</span></div></div><div class="small" style="margin-top:6px">비용 0.2% 차감</div></section>`;
    h+=`<section class="card"><h2>최근 청산</h2>`;
    for(const r of done.slice(0,15))h+=`<div class="stock"><div><div class="nm">${esc(r.name)}<span class="cd">${r.code}</span></div><div class="dt">${md(r.date)} ${usd(r.entry)} → ${md(r.exitDate)} ${usd(r.exitPrice)} · ${esc(r.act)}</div></div><div class="rt ${cls(r.ret)}"><b>${pct(r.ret)}</b></div></div>`;
    h+=`</section>`;
  } else if(u.summary){h+=`<section class="card"><h2>누적 성적</h2><div class="small">${esc(u.summary)}</div></section>`;}
  h+=`<section class="card"><h2>규칙</h2><div class="small">${esc(u.rule)}<br>${esc(u.schedule)}</div></section>`;
  return h;
}

function renderEvolve(e){
  if(!e||!e.summary||!e.summary.length)return "";
  return `<section class="card"><h2>🧪 자동 개선 루프</h2><div class="small">${e.summary.map(esc).join("<br>")}</div><div class="small" style="margin-top:4px">화~토 07:13 실행. 현재 추천 규칙과는 별개로 시험 중이에요.</div></section>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===TAB));
  if(!DATA)return;
  $("#app").innerHTML=(TAB==="kr"?renderKR(DATA.kr):renderUS(DATA.us))+renderEvolve(DATA.evolve);
}
async function load(){
  $("#upd").textContent="불러오는 중…";
  try{
    const r=await fetch("/api/board",{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    DATA=await r.json();
    const t=new Date(DATA.now).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
    $("#upd").innerHTML=`시세 ${t}<br>장부 ${esc(DATA.updated_at)}`;
    render();
  }catch(e){$("#upd").innerHTML=`<span class="err">불러오기 실패</span>`;if(!DATA)$("#app").innerHTML=`<div class="card err">데이터를 못 불러왔어요. 잠시 뒤 새로고침해 주세요.</div>`;}
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;try{localStorage.setItem("tab",TAB)}catch(e){};render();});
render();load();
setInterval(()=>{if(document.visibilityState==="visible")load()},120000);
</script>
</body>
</html>

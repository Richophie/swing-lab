name: Concentration Risk Damp V2

on:
  pull_request:
    paths:
      - 'portfolio_concentration_damp_research.py'
      - 'tests/test_portfolio_concentration_damp_research.py'
      - '.github/workflows/concentration-risk-damp-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile portfolio_concentration_damp_research.py tests/test_portfolio_concentration_damp_research.py
      - name: Deterministic tests
        run: PYTHONPATH=. python tests/test_portfolio_concentration_damp_research.py
      - name: Run current-baseline concentration research
        run: PYTHONPATH=. python portfolio_concentration_damp_research.py
      - name: Validate artifact and frozen baseline parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/portfolio_concentration_damp_v2.json').read_text(encoding='utf-8'))
          assert d['ready'] is True
          assert d['promotion_status']=='development_only_concentration_risk_damp_not_main_picker'
          assert d['method']['grid_search'] is False
          assert d['method']['production_main_picker_mutated'] is False
          assert d['method']['forward_v1_v2_mutated'] is False
          assert len(d['data']['sector_etfs_loaded']) >= 8
          s=d['summary']
          assert set(s)=={'baseline','sector_half','corr_half','combined_half'}
          baseline=s['baseline']['stitched_test_return_pct']
          # Must reproduce the current 0.75% / max10 / natural-exit reference.
          assert 84.0 <= baseline <= 95.0, baseline
          print('concentration artifact PASS; baseline', baseline)
          print(json.dumps(s, ensure_ascii=False, indent=2))
          print('FOLD RETURNS')
          for fold in d['folds']:
              print(fold['fold'], {k:v['return_pct'] for k,v in fold['variants'].items()})
          PY

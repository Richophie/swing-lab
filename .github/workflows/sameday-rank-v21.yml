name: Same-day Rank V2.1 Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'portfolio_sameday_rank_v21.py'
      - 'tests/test_portfolio_sameday_rank_v21.py'
      - '.github/workflows/sameday-rank-v21.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio_sameday_rank_v21.py'
      - 'static/replay_backtest_pool_v2.json'
      - '.github/workflows/sameday-rank-v21.yml'

permissions:
  contents: write

concurrency:
  group: sameday-rank-v21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile portfolio_sameday_rank_v21.py tests/test_portfolio_sameday_rank_v21.py
      - name: Deterministic tests
        run: PYTHONPATH=. python tests/test_portfolio_sameday_rank_v21.py
      - name: Run V2.1 on current V4 pool
        run: python portfolio_sameday_rank_v21.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/portfolio_sameday_rank_v21.json').read_text(encoding='utf-8'))
          assert d['ready'] is True
          assert d['promotion_status']=='posthoc_development_only_not_fresh_holdout'
          assert d['hypothesis']['grid_search'] is False
          assert d['hypothesis']['candidate_exclusion'] is False
          assert d['hypothesis']['max_risk_budget_pct'] <= 1.0
          assert d['method']['v1_untouched'] is True
          print('\nSame-day rank V2.1 summary')
          for key,x in d['summary'].items():
              print(key,'ret',x['stitched_test_return_pct'],'mdd',x['worst_test_mdd_pct'],'positive',x['positive_test_folds'],'trades',x['total_test_trades'],'beats_v1',x.get('folds_beating_v1'),'beats_global',x.get('folds_beating_global_tiered'),'delta_global',x.get('mean_delta_vs_global_tiered_pct'))
          for f in d['folds']:
              print(f['fold'],{k:v['test']['return_pct'] for k,v in f['variants'].items()})
          PY
      - name: Publish result on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/portfolio_sameday_rank_v21.json
          if git diff --cached --quiet; then
            echo "No V2.1 changes"
          else
            git commit -m "research: refresh same-day rank V2.1 [skip ci]"
            git pull --rebase origin main
            git push
          fi

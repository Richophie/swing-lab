name: Weekly Score Calibration

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 0'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python calibrate_scores.py
      - name: Commit calibration
        run: |
          git config user.name "swing-lab-calibrator"
          git config user.email "actions@users.noreply.github.com"
          git add static/score_calibration.json
          if git diff --cached --quiet; then
            echo "No calibration changes"
          else
            git commit -m "data: refresh score calibration"
            git push
          fi

name: Market Scan Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 13-21 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'config.py'
      - 'market_data.py'
      - 'strategy_engine.py'
      - 'stock_names.py'
      - 'scanner.py'
      - 'journal.py'
      - 'backtest_engine.py'
      - 'app.py'
      - 'qa.py'
      - 'static/dashboard.html'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: market-scan-cache
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile clean modules
        run: python -m py_compile config.py market_data.py strategy_engine.py stock_names.py scanner.py journal.py backtest_engine.py app.py qa.py
      - name: Build latest recommendations
        run: python scanner.py
      - name: Clean architecture QA gate
        run: python qa.py
      - name: Freeze signals and update outcomes
        run: python journal.py
      - name: Commit latest scan and journal
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/latest_scan.json static/trade_history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh clean swing signals and journal"
            git pull --rebase origin main
            git push
          fi

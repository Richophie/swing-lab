name: Market Scan Cache

on:
  workflow_dispatch:
  schedule:
    # 30-minute cache refresh across the US regular-session window.
    # The wider UTC window safely covers both EDT and EST.
    - cron: '*/30 13-21 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'core_v2.py'
      - 'scanner_v9.py'
      - 'app_v9.py'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: market-scan-cache
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scanner_v9.py
      - name: Commit latest scan
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/latest_scan.json
          if git diff --cached --quiet; then
            echo "No scan changes"
          else
            git commit -m "data: refresh v9 market scan cache"
            git pull --rebase origin main
            git push
          fi

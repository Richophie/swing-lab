name: Market Scan Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 13-21 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'core_v2.py'
      - 'core_v3.py'
      - 'core_v4.py'
      - 'engine_qa.py'
      - 'scanner_v10.py'
      - 'trade_journal_v3.py'
      - 'app_v11.py'
      - 'app_v12.py'
      - 'app_v13.py'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: market-scan-cache
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build latest S recommendations by four strategies
        run: python scanner_v10.py
      - name: Regression QA gate
        run: |
          python - <<'PY'
          import json
          from engine_qa import distribution_guard
          with open('static/latest_scan.json', encoding='utf-8') as f:
              payload=json.load(f)
          assert payload.get('core_version') == '4.0', payload.get('core_version')
          assert payload.get('version') == '13.0', payload.get('version')
          assert payload.get('display_filter') == 'S only', payload.get('display_filter')
          for row in payload.get('results', []):
              assert row.get('grade') == 'S'
              assert row.get('strategy_signals'), row.get('symbol')
          print(distribution_guard(payload.get('results', [])))
          PY
      - name: Freeze S signals by symbol and strategy and update outcomes
        run: python trade_journal_v3.py
      - name: Commit latest scan and journal
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/latest_scan.json static/trade_history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh v13 S strategy signals and journal"
            git pull --rebase origin main
            git push
          fi

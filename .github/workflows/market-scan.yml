name: Market Scan Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 13-22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'config.py'
      - 'baseline_rules.py'
      - 'baseline_journal.py'
      - 'intraday_execution.py'
      - 'intraday_outcome_repair.py'
      - 'market_data.py'
      - 'strategy_rules.py'
      - 'strategy_engine.py'
      - 'stock_names.py'
      - 'scanner.py'
      - 'global_flow_map.py'
      - 'earnings_events.py'
      - 'risk_observability.py'
      - 'paper_broker.py'
      - 'paper_broker_service.py'
      - 'paper_plan.py'
      - 'paper_manual.py'
      - 'paper_entry.py'
      - 'repo_data.py'
      - 'shadow_lab.py'
      - 'priority_challenger_v1.py'
      - 'priority_challenger_v2.py'
      - 'priority_challenger_v3.py'
      - 'priority_challenger_v4.py'
      - 'forward_review.py'
      - 'signal_log.py'
      - 'journal.py'
      - 'history_marks.py'
      - 'rebuild_journal_day.py'
      - 'refresh_fx_cache.py'
      - 'backtest_engine.py'
      - 'app.py'
      - 'qa.py'
      - 'static/dashboard.html'
      - 'static/dashboard.css'
      - 'static/dashboard.js'
      - 'static/detail_overlay.js'
      - 'static/ui_controls.js'
      - 'static/history_polish.js'
      - 'static/history_returns_v2.css'
      - 'static/lab_dashboard.js'
      - 'static/lab_dashboard.css'
      - 'static/global_flow_map.js'
      - 'static/global_flow_map.css'
      - 'static/priority_challenger_v1.js'
      - 'static/priority_challenger_v1.css'
      - 'static/priority_challenger_ab.js'
      - 'static/priority_challenger_ab.css'
      - 'static/forward_review_ui.js'
      - 'static/forward_review.css'
      - 'static/signal_event_polish.js'
      - 'static/event_risk.css'
      - 'static/event_risk_ui.js'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: market-scan-cache
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile clean modules
        run: python -m py_compile config.py baseline_rules.py baseline_journal.py intraday_execution.py intraday_outcome_repair.py market_data.py strategy_rules.py strategy_engine.py stock_names.py scanner.py global_flow_map.py earnings_events.py risk_observability.py paper_broker.py paper_broker_service.py paper_plan.py paper_manual.py paper_entry.py repo_data.py shadow_lab.py priority_challenger_v1.py priority_challenger_v2.py priority_challenger_v3.py priority_challenger_v4.py forward_review.py signal_log.py journal.py history_marks.py rebuild_journal_day.py refresh_fx_cache.py backtest_engine.py app.py qa.py
      - name: Rebuild Aug 12 journal with current strategy logic
        run: python rebuild_journal_day.py
      - name: Build latest live candidates
        run: python scanner.py
      - name: Refresh global sector and region flow proxy
        run: python global_flow_map.py
      - name: Freeze Challenger V1 calibration once
        run: python priority_challenger_v1.py freeze
      - name: Advance frozen priority Challenger V1 forward shadow
        run: python priority_challenger_v1.py run
      - name: Freeze capital Challenger V2 calibration once
        run: python priority_challenger_v2.py freeze
      - name: Advance capital Challenger V2 forward shadow
        run: python priority_challenger_v2.py run
      - name: Freeze correlation-risk Challenger V3 once
        run: python priority_challenger_v3.py freeze
      - name: Advance correlation-risk Challenger V3 forward shadow
        run: python priority_challenger_v3.py run
      - name: Freeze same-day-rank Challenger V4 once
        run: python priority_challenger_v4.py freeze
      - name: Advance same-day-rank Challenger V4 forward shadow
        run: python priority_challenger_v4.py run
      - name: Build Forward promotion review
        run: python forward_review.py
      - name: Refresh persisted USDKRW cache
        run: python refresh_fx_cache.py
      - name: Append intraday candidate transitions
        run: python signal_log.py
      - name: Clean architecture QA gate
        run: python qa.py
      - name: Freeze close-confirmed signals and update outcomes
        run: python journal.py
      - name: Mark recommendation archive to current market
        run: python history_marks.py
      - name: Freeze baseline metadata on official recommendations
        run: python baseline_journal.py
      - name: Resolve same-day STOP/TARGET order with minute data
        run: python intraday_outcome_repair.py
      - name: Advance A/B automatic research portfolios
        run: python shadow_lab.py
      - name: Commit latest scan, caches, logs, journal and research portfolios
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/latest_scan.json static/global_flow_map.json static/fx_cache.json static/earnings_cache.json static/signal_events.json static/trade_history.json static/shadow_portfolio.json static/shadow_portfolio_touch.json static/priority_challenger_v1_calibration.json static/priority_challenger_v1_state.json static/priority_challenger_v2_calibration.json static/priority_challenger_v2_state.json static/priority_challenger_v3_calibration.json static/priority_challenger_v3_state.json static/priority_challenger_v4_calibration.json static/priority_challenger_v4_state.json static/forward_review.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh signals, flow map and forward research labs [skip render]"
            git pull --rebase origin main
            git push
          fi

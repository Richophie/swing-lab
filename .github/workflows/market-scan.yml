name: Market Scan Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 13-22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'config.py'
      - 'market_data.py'
      - 'strategy_rules.py'
      - 'strategy_engine.py'
      - 'stock_names.py'
      - 'scanner.py'
      - 'signal_log.py'
      - 'journal.py'
      - 'rebuild_journal_day.py'
      - 'refresh_fx_cache.py'
      - 'backtest_engine.py'
      - 'app.py'
      - 'qa.py'
      - 'static/dashboard.html'
      - 'static/dashboard.css'
      - 'static/dashboard.js'
      - 'static/detail_overlay.js'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: market-scan-cache
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile clean modules
        run: python -m py_compile config.py market_data.py strategy_rules.py strategy_engine.py stock_names.py scanner.py signal_log.py journal.py rebuild_journal_day.py refresh_fx_cache.py backtest_engine.py app.py qa.py
      - name: Rebuild Aug 12 journal with current strategy logic
        run: python rebuild_journal_day.py
      - name: Build latest live candidates
        run: python scanner.py
      - name: Refresh persisted USDKRW cache
        run: python refresh_fx_cache.py
      - name: Append intraday candidate transitions
        run: python signal_log.py
      - name: Clean architecture QA gate
        run: python qa.py
      - name: Freeze close-confirmed signals and update outcomes
        run: python journal.py
      - name: Commit latest scan, FX cache, signal log and confirmed journal
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/latest_scan.json static/fx_cache.json static/signal_events.json static/trade_history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh live signals and confirmed journal [skip render]"
            git pull --rebase origin main
            git push
          fi

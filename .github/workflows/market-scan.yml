name: Market Scan Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 13-22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'config.py'
      - 'baseline_rules.py'
      - 'baseline_journal.py'
      - 'intraday_execution.py'
      - 'intraday_outcome_repair.py'
      - 'market_data.py'
      - 'strategy_rules.py'
      - 'strategy_engine.py'
      - 'stock_names.py'
      - 'scanner.py'
      - 'earnings_events.py'
      - 'risk_observability.py'
      - 'paper_broker.py'
      - 'paper_broker_service.py'
      - 'paper_plan.py'
      - 'paper_manual.py'
      - 'paper_entry.py'
      - 'repo_data.py'
      - 'shadow_lab.py'
      - 'signal_log.py'
      - 'journal.py'
      - 'history_marks.py'
      - 'rebuild_journal_day.py'
      - 'refresh_fx_cache.py'
      - 'backtest_engine.py'
      - 'app.py'
      - 'qa.py'
      - 'static/dashboard.html'
      - 'static/dashboard.css'
      - 'static/dashboard.js'
      - 'static/detail_overlay.js'
      - 'static/ui_controls.js'
      - 'static/history_polish.js'
      - 'static/history_returns_v2.css'
      - 'static/lab_dashboard.js'
      - 'static/lab_dashboard.css'
      - 'static/signal_event_polish.js'
      - 'static/event_risk.css'
      - 'static/event_risk_ui.js'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: market-scan-cache
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile clean modules
        run: python -m py_compile config.py baseline_rules.py baseline_journal.py intraday_execution.py intraday_outcome_repair.py market_data.py strategy_rules.py strategy_engine.py stock_names.py scanner.py earnings_events.py risk_observability.py paper_broker.py paper_broker_service.py paper_plan.py paper_manual.py paper_entry.py repo_data.py shadow_lab.py signal_log.py journal.py history_marks.py rebuild_journal_day.py refresh_fx_cache.py backtest_engine.py app.py qa.py
      - name: Rebuild Aug 12 journal with current strategy logic
        run: python rebuild_journal_day.py
      - name: Build latest live candidates
        run: python scanner.py
      - name: Refresh persisted USDKRW cache
        run: python refresh_fx_cache.py
      - name: Append intraday candidate transitions
        run: python signal_log.py
      - name: Clean architecture QA gate
        run: python qa.py
      - name: Freeze close-confirmed signals and update outcomes
        run: python journal.py
      - name: Mark recommendation archive to current market
        run: python history_marks.py
      - name: Freeze baseline metadata on official recommendations
        run: python baseline_journal.py
      - name: Resolve same-day STOP/TARGET order with minute data
        run: python intraday_outcome_repair.py
      - name: Advance A/B automatic research portfolios
        run: python shadow_lab.py
      - name: Commit latest scan, caches, logs, journal and A/B research portfolios
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/latest_scan.json static/fx_cache.json static/earnings_cache.json static/signal_events.json static/trade_history.json static/shadow_portfolio.json static/shadow_portfolio_touch.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh signals, journal and A-B forward lab [skip render]"
            git pull --rebase origin main
            git push
          fi

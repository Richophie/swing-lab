name: Market Scan Cache

on:
  workflow_dispatch:
  schedule:
    # US regular-session window, every 30 minutes. Covers EDT/EST safely.
    - cron: '*/30 13-21 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'core_v2.py'
      - 'core_v3.py'
      - 'scanner_v10.py'
      - 'trade_journal.py'
      - 'app_v11.py'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write

concurrency:
  group: market-scan-cache
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build latest A/S recommendations
        run: python scanner_v10.py
      - name: Freeze new recommendations and update outcomes
        run: python trade_journal.py
      - name: Commit latest scan and journal
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/latest_scan.json static/trade_history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh v11 signals and journal"
            git pull --rebase origin main
            git push
          fi

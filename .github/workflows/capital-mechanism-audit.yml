name: Capital Mechanism Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'capital_mechanism_audit.py'
      - 'tests/test_capital_mechanism_audit.py'
      - '.github/workflows/capital-mechanism-audit.yml'
  push:
    branches: [main]
    paths:
      - 'capital_mechanism_audit.py'
      - 'static/replay_backtest_pool_v2.json'
      - '.github/workflows/capital-mechanism-audit.yml'

permissions:
  contents: write
concurrency:
  group: capital-mechanism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile capital_mechanism_audit.py tests/test_capital_mechanism_audit.py
      - name: Deterministic tests
        run: PYTHONPATH=. python tests/test_capital_mechanism_audit.py
      - name: Run mechanism audit on V4 pool
        run: python capital_mechanism_audit.py
      - name: Validate artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/capital_mechanism_audit.json').read_text(encoding='utf-8'))
          assert d['ready'] is True
          assert d['promotion_status']=='mechanism_diagnostic_only_not_fresh_holdout'
          assert d['method']['grid_search'] is False
          assert d['method']['v1_untouched'] is True
          assert list(d['summary'])==['flat_100','flat_075','flat_050','tiered','reversed']
          print('\nCapital mechanism audit')
          for key,x in d['summary'].items():
              print(key,'ret',x['stitched_test_return_pct'],'mdd',x['worst_mdd_pct'],'positive',x['positive_folds'],'trades',x['total_trades'],'cashrej',x['total_cash_rejects'],'cashlimited',x['total_cash_limited_entries'],'exposure',x['mean_avg_exposure_pct'],'cash',x['mean_avg_cash_pct'],'vs075',x.get('folds_beating_flat075'),'vsrev',x.get('folds_beating_reversed'))
          print('interpretation',d['interpretation'])
          for f in d['folds']:
              print(f['fold'],{k:v['return_pct'] for k,v in f['variants'].items()})
          PY
      - name: Publish on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/capital_mechanism_audit.json
          if git diff --cached --quiet; then
            echo "No mechanism audit changes"
          else
            git commit -m "research: refresh capital mechanism audit [skip ci]"
            git pull --rebase origin main
            git push
          fi

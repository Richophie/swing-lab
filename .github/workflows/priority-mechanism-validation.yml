name: Priority Allocation Mechanism Validation

on:
  pull_request:
    paths:
      - 'portfolio_priority_mechanism.py'
      - 'tests/test_portfolio_priority_mechanism.py'
      - '.github/workflows/priority-mechanism-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile portfolio_priority_mechanism.py tests/test_portfolio_priority_mechanism.py
      - name: Deterministic tests
        run: PYTHONPATH=. python tests/test_portfolio_priority_mechanism.py
      - name: Run post-hoc mechanism diagnosis on current V4 pool
        run: python portfolio_priority_mechanism.py
      - name: Print diagnosis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/portfolio_priority_mechanism.json').read_text(encoding='utf-8'))
          assert d['ready'] is True
          assert d['promotion_status']=='posthoc_mechanism_diagnostic_only'
          for f in d['families']:
              print('\n',f['name'])
              for rid in ('current','current_pct','quality_pct','hybrid_50'):
                  x=f['summary']['rules'][rid]
                  print(rid,'ret',x['stitched_test_return_pct'],'mdd',x['worst_test_mdd_pct'],'beats',x.get('folds_beating_current'),'delta',x.get('mean_delta_vs_current_pct'),'cash_limited',x['cash_limited_entries'],'cash_rejects',x['cash_exhausted_rejects'],'capacity',x['capacity_rejects'])
              print('2024',f['summary'].get('test_2024'))
          PY

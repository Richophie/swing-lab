name: Core4 Walk Forward Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core_v4.py'
      - 'app_v12.py'
      - 'walkforward_v1.py'
      - '.github/workflows/walkforward.yml'

permissions:
  contents: write

concurrency:
  group: core4-walkforward
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run chronological OOS validation
        run: python walkforward_v1.py
      - name: Commit validation report
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/walkforward_report.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "data: refresh core4 walk-forward validation"
            git pull --rebase origin main
            git push
          fi

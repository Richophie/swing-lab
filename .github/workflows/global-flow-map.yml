name: Global Flow Map

on:
  pull_request:
    paths:
      - 'global_flow_map.py'
      - 'tests/test_global_flow_map.py'
      - 'static/global_flow_map.js'
      - 'static/global_flow_map.css'
      - 'static/lab_dashboard.js'
      - '.github/workflows/global-flow-map.yml'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile global_flow_map.py tests/test_global_flow_map.py
      - name: Deterministic tests
        run: PYTHONPATH=. python tests/test_global_flow_map.py
      - name: Build live proxy snapshot
        run: python global_flow_map.py
      - name: Validate artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/global_flow_map.json').read_text(encoding='utf-8'))
          assert d['version']==1
          assert d['method']['not_fund_flow'] is True
          assert d['method']['trade_signal'] is False
          if d.get('ready'):
              assert len(d['sectors']) >= 8
              assert len(d['regions']) >= 6
              assert all('flow_score' in x for x in d['sectors'])
              print('global flow live snapshot PASS', d['pulse']['state'])
          else:
              print('global flow provider unavailable; fallback artifact is structurally valid')
          PY

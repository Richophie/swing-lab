name: Flow Selection Diagnostic Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'portfolio_flow_selection_diagnostic.py'
      - 'portfolio_concentration_damp_research.py'
      - 'global_flow_map.py'
      - 'tests/test_portfolio_flow_selection_diagnostic.py'
      - '.github/workflows/flow-selection-diagnostic-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile portfolio_flow_selection_diagnostic.py tests/test_portfolio_flow_selection_diagnostic.py
      - name: Deterministic Flow tests
        run: PYTHONPATH=. python tests/test_portfolio_flow_selection_diagnostic.py
      - name: Real historical diagnostic
        run: PYTHONPATH=. python portfolio_flow_selection_diagnostic.py
      - name: Validate research-only artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/portfolio_flow_selection_diagnostic.json').read_text(encoding='utf-8'))
          assert d['ready'] is True
          assert d['promotion_status']=='development_only_report_no_main_picker_mutation'
          assert d['method']['production_main_picker_mutated'] is False
          assert d['method']['live_orders_mutated'] is False
          assert d['method']['portfolio_filter_applied'] is False
          assert d['family']['id']=='confirmed_sma_donchian'
          assert d['family']['quality_intensity']=='loose'
          assert len(d['folds']) >= 3
          assert d['data']['classified_trades'] > 50
          s=d['summary']
          print('pattern',s['pattern'])
          print('rank corr',s['spearman_flow_vs_trade_return'])
          print('strong-minus-weak mean pp',s['strong_minus_weak_mean_return_pp'])
          print('strong beats weak folds',s['strong_beats_weak_folds'],'/',s['comparable_folds'])
          print('buckets',json.dumps(s['buckets'],ensure_ascii=False,indent=2))
          PY

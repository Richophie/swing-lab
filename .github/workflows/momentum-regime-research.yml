name: Momentum Regime Research

on:
  pull_request:
    paths:
      - 'momentum_regime_research.py'
      - 'gap_guard_research.py'
      - 'structural_stop_research.py'
      - 'tests/test_momentum_regime_research.py'
      - '.github/workflows/momentum-regime-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile research modules
        run: python -m py_compile momentum_regime_research.py tests/test_momentum_regime_research.py
      - name: Deterministic regime tests
        run: PYTHONPATH=. python tests/test_momentum_regime_research.py
      - name: Broad 80-symbol momentum regime diagnosis
        run: PYTHONPATH=. python momentum_regime_research.py
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-regime-research
          path: artifacts/momentum_regime_research.json
          if-no-files-found: warn

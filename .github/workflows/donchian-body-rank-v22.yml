name: Donchian Body Rank V2.2 Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'donchian_body_rank_v22.py'
      - 'tests/test_donchian_body_rank_v22.py'
      - '.github/workflows/donchian-body-rank-v22.yml'
  push:
    branches: [main]
    paths:
      - 'donchian_body_rank_v22.py'
      - 'static/replay_backtest_pool_v2.json'
      - '.github/workflows/donchian-body-rank-v22.yml'

permissions:
  contents: write
concurrency:
  group: donchian-body-rank-v22-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile donchian_body_rank_v22.py tests/test_donchian_body_rank_v22.py
      - name: Deterministic tests
        run: PYTHONPATH=. python tests/test_donchian_body_rank_v22.py
      - name: Run V2.2
        run: python donchian_body_rank_v22.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/donchian_body_rank_v22.json').read_text(encoding='utf-8'))
          assert d['ready'] is True
          assert d['promotion_status']=='posthoc_development_only_not_fresh_holdout'
          assert d['hypothesis']['grid_search'] is False
          assert d['hypothesis']['eligibility_gate_changed'] is False
          assert d['method']['v1_untouched'] is True
          print('\nDonchian body rank V2.2 summary')
          for key,x in d['summary'].items():
              print(key,'ret',x['stitched_test_return_pct'],'mdd',x['worst_test_mdd_pct'],'positive',x['positive_test_folds'],'trades',x['total_test_trades'],'beats_v1',x.get('folds_beating_v1'),'beats_current',x.get('folds_beating_current_tiered'),'delta_current',x.get('mean_delta_vs_current_tiered_pct'))
          for f in d['folds']:
              print(f['fold'],{k:v['test']['return_pct'] for k,v in f['variants'].items()})
          PY
      - name: Publish on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/donchian_body_rank_v22.json
          if git diff --cached --quiet; then
            echo "No V2.2 changes"
          else
            git commit -m "research: refresh Donchian body rank V2.2 [skip ci]"
            git pull --rebase origin main
            git push
          fi

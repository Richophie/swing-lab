name: Daily Backtest Research Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'replay_pool_v2.py'
      - 'strategy_optimizer_runner.py'
      - 'strategy_optimizer_v2.py'
      - 'strategy_selection_research.py'
      - 'portfolio_walkforward_research.py'
      - 'portfolio_regime_research.py'
      - 'portfolio_volatility_diagnostic.py'
      - '.github/workflows/replay-lab-v2.yml'
  schedule:
    - cron: '40 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: daily-backtest-research-main
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: 1. Build replay V4 path and quality cache
        run: python replay_pool_v2.py
      - name: Validate replay quality cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/replay_backtest_pool_v2.json').read_text(encoding='utf-8'))
          assert d.get('ready') is True
          assert d.get('version',0) >= 4
          assert d.get('quality_features_version') == 1
          don=[x for x in d.get('trades',[]) if x.get('strategy_id')=='donchian_55']
          sma=[x for x in d.get('trades',[]) if x.get('strategy_id')=='sma200_20_squeeze']
          assert don and sma
          assert all('breakout_atr' in (x.get('quality_features') or {}) for x in don[:100])
          assert all('ma_spread_pct' in (x.get('quality_features') or {}) for x in sma[:100])
          print('quality cache PASS',len(don),len(sma))
          PY

      - name: 2. Run holdout-safe MTM optimizer
        run: python strategy_optimizer_runner.py
      - name: Validate optimizer result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/strategy_optimizer_results.json').read_text(encoding='utf-8'))
          assert d.get('ready') is True
          assert d.get('version',0) >= 4
          assert d.get('promotion_status') == 'research_only'
          assert d.get('parameter_grid',{}).get('forced_profit_pct') == [None]
          assert d.get('parameter_grid',{}).get('hold_cap_days') == [None]
          assert d.get('risk_model',{}).get('mdd') == 'daily_close_mark_to_market'
          print('optimizer PASS',d.get('tested_configurations'),d.get('validated_configurations'))
          PY

      - name: 3. Run strategy-specific selection research
        run: python strategy_selection_research.py
      - name: Validate selection research result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/strategy_selection_results.json').read_text(encoding='utf-8'))
          assert d.get('ready') is True
          assert d.get('version',0) >= 2
          assert d.get('promotion_status') == 'research_only'
          assert d.get('method',{}).get('equity') == 'daily_close_mark_to_market'
          assert d.get('method',{}).get('holdout_boundary')
          assert len(d.get('families',[])) == 3
          for f in d['families']:
              assert [v['intensity'] for v in f['variants']] == ['raw','loose','normal','strong']
              assert sum(1 for v in f['variants'] if v.get('train_pick')) == 1
          print('selection PASS',[(f['id'],f['train_selected_intensity']) for f in d['families']])
          PY

      - name: 4. Run rolling portfolio walk-forward
        run: python portfolio_walkforward_research.py
      - name: Validate walk-forward result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/portfolio_walkforward_results.json').read_text(encoding='utf-8'))
          assert d.get('ready') is True
          assert d.get('promotion_status') == 'research_only'
          assert d.get('method',{}).get('type') == 'rolling walk-forward'
          assert d.get('method',{}).get('equity') == 'daily_close_mark_to_market'
          assert len(d.get('families',[])) == 3
          for f in d['families']:
              assert len(f.get('folds',[])) >= 3
              assert f.get('summary',{}).get('grade') in {'A','B','C'}
              assert all(x.get('selected_intensity') in {'raw','loose','normal','strong'} for x in f['folds'])
          print('walk-forward PASS',[(f['id'],f['summary']['grade']) for f in d['families']])
          PY

      - name: 5. Run train-only market regime gate walk-forward
        run: python portfolio_regime_research.py
      - name: Validate market regime result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/portfolio_regime_results.json').read_text(encoding='utf-8'))
          assert d.get('ready') is True
          assert d.get('promotion_status') == 'research_only'
          assert d.get('method',{}).get('type') == 'rolling walk-forward regime gate'
          assert d.get('method',{}).get('equity') == 'daily_close_mark_to_market'
          assert len(d.get('families',[])) == 3
          for f in d['families']:
              assert len(f.get('folds',[])) >= 3
              assert f.get('summary',{}).get('grade') in {'A','B','C'}
              assert all(x.get('selected_gate') in {'all','avoid_risk_off','risk_on_only'} for x in f['folds'])
              assert all('test_same_quality_no_gate' in x for x in f['folds'])
          print('regime gate PASS',[(f['id'],f['summary']['grade']) for f in d['families']])
          PY

      - name: 6. Diagnose volatility inside green market regimes
        run: python portfolio_volatility_diagnostic.py
      - name: Validate volatility diagnostic result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/portfolio_volatility_diagnostic.json').read_text(encoding='utf-8'))
          assert d.get('ready') is True
          assert d.get('promotion_status') == 'research_only_diagnostic'
          assert d.get('method',{}).get('type') == 'rolling OOS volatility regime diagnosis'
          assert d.get('method',{}).get('equity') == 'daily_close_mark_to_market'
          assert len(d.get('families',[])) == 3
          for f in d['families']:
              assert len(f.get('folds',[])) >= 3
              assert f.get('summary',{}).get('green_high_vol_drag_pattern') in {'strong','mixed','weak'}
              assert all('test_full_no_market_filter' in x for x in f['folds'])
              assert all('green_high_vol' in x.get('states',{}) for x in f['folds'])
          print('volatility diagnosis PASS',[(f['id'],f['summary']['green_high_vol_drag_pattern']) for f in d['families']])
          PY

      - name: Commit all research outputs together
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/replay_backtest_pool_v2.json static/strategy_optimizer_results.json static/strategy_selection_results.json static/portfolio_walkforward_results.json static/portfolio_regime_results.json static/portfolio_volatility_diagnostic.json
          if git diff --cached --quiet; then
            echo "No research data changes"
            exit 0
          fi
          git commit -m "data: refresh daily backtest research [skip render]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another data writer; retry $attempt"
            sleep 3
          done
          exit 1

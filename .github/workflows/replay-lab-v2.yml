name: Replay Lab V2 Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'replay_pool_v2.py'
      - '.github/workflows/replay-lab-v2.yml'
  schedule:
    - cron: '40 22 * * 1-5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build replay V2 path cache
        run: python replay_pool_v2.py
      - name: Commit replay V2 cache
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/replay_backtest_pool_v2.json
          if git diff --cached --quiet; then
            echo "No replay V2 changes"
          else
            git commit -m "data: refresh replay V2 path cache"
            git pull --rebase origin main
            git push
          fi

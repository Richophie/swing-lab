name: Batch Allocation Validation

on:
  pull_request:
    paths:
      - 'portfolio_batch_allocation_diagnostic.py'
      - 'tests/test_portfolio_batch_allocation_diagnostic.py'
      - '.github/workflows/batch-allocation-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile portfolio_batch_allocation_diagnostic.py tests/test_portfolio_batch_allocation_diagnostic.py
      - name: Deterministic tests
        run: PYTHONPATH=. python tests/test_portfolio_batch_allocation_diagnostic.py
      - name: Run diagnosis on current V4 pool
        run: python portfolio_batch_allocation_diagnostic.py
      - name: Print diagnosis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('static/portfolio_batch_allocation_diagnostic.json').read_text(encoding='utf-8'))
          assert d['ready'] is True
          assert d['promotion_status']=='posthoc_allocation_diagnostic_only'
          for f in d['families']:
              print('\n',f['name'])
              for vid in ('sequential_current','batch_current','sequential_hybrid','batch_hybrid'):
                  x=f['summary']['variants'][vid]
                  print(vid,'ret',x['stitched_test_return_pct'],'mdd',x['worst_test_mdd_pct'],'positive',x['positive_test_folds'],'trades',x['total_test_trades'],'beats',x.get('folds_beating_sequential'),'delta',x.get('mean_delta_vs_sequential_pct'),'scaled',x['total_scaled_entries'],'cash_reject',x['total_reject_cash'])
              print('2024',f['summary'].get('test_2024'))
          PY

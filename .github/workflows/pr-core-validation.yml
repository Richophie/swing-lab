name: PR Core Validation

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'config.py'
      - 'market_data.py'
      - 'strategy_rules.py'
      - 'strategy_engine.py'
      - 'scanner.py'
      - 'earnings_events.py'
      - 'risk_observability.py'
      - 'backtest_engine.py'
      - 'portfolio_backtest.py'
      - 'backtrader_audit.py'
      - 'audit_matrix.py'
      - 'corporate_action_audit.py'
      - 'execution_quality.py'
      - 'net_rr_research.py'
      - 'rsi2_selector_research.py'
      - 'paper_broker.py'
      - 'paper_broker_service.py'
      - 'paper_plan.py'
      - 'paper_manual.py'
      - 'paper_marks.py'
      - 'paper_restore.py'
      - 'paper_entry.py'
      - 'shadow_lab.py'
      - 'repo_data.py'
      - 'render.yaml'
      - 'refresh_fx_cache.py'
      - 'stock_names.py'
      - 'signal_log.py'
      - 'journal.py'
      - 'app.py'
      - 'qa.py'
      - 'static/dashboard.html'
      - 'static/dashboard.js'
      - 'static/chart_guides.js'
      - 'static/backtest_compat.js'
      - 'static/backtest_results.css'
      - 'static/fx_cache.json'
      - 'static/earnings_cache.json'
      - 'static/shadow_portfolio.json'
      - 'static/paper_persistence.js'
      - 'static/paper_mark_to_market.js'
      - 'static/detail_overlay.js'
      - 'static/ui_controls.js'
      - 'static/indie_finance_theme.css'
      - 'static/indie_finance_ui.js'
      - 'static/pop_indie_polish.css'
      - 'static/pop_indie_polish.js'
      - 'static/semantic_palette.css'
      - 'static/signal_event_polish.js'
      - 'static/event_risk.css'
      - 'static/event_risk_ui.js'
      - 'tests/test_strategy_rules.py'
      - 'tests/test_backtest_v2.py'
      - 'tests/test_backtrader_audit.py'
      - 'tests/test_paper_broker.py'
      - 'tests/test_paper_manual.py'
      - 'tests/test_shadow_lab.py'
      - 'tests/test_signal_log_tiers.py'
      - 'tests/test_paper_marks.py'
      - 'tests/test_paper_restore.py'
      - 'tests/test_signal_history.py'
      - 'tests/test_repo_data.py'
      - 'tests/test_startup_stability.py'
      - 'tests/test_ui_wiring.py'
      - 'tests/test_p0_structure.py'
      - 'tests/test_net_rr_research.py'
      - 'tests/test_selection_precision.py'
      - 'tests/test_rsi2_selector_research.py'
      - 'tests/test_earnings_events.py'
      - 'tests/test_risk_observability.py'
      - '.github/workflows/market-scan.yml'
      - '.github/workflows/pr-core-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile core modules
        run: python -m py_compile config.py market_data.py strategy_rules.py strategy_engine.py scanner.py earnings_events.py risk_observability.py backtest_engine.py portfolio_backtest.py backtrader_audit.py audit_matrix.py corporate_action_audit.py execution_quality.py net_rr_research.py rsi2_selector_research.py paper_broker.py paper_broker_service.py paper_plan.py paper_manual.py paper_marks.py paper_restore.py paper_entry.py shadow_lab.py repo_data.py refresh_fx_cache.py stock_names.py signal_log.py journal.py app.py qa.py tests/test_strategy_rules.py tests/test_backtest_v2.py tests/test_backtrader_audit.py tests/test_paper_broker.py tests/test_paper_manual.py tests/test_shadow_lab.py tests/test_signal_log_tiers.py tests/test_paper_marks.py tests/test_paper_restore.py tests/test_signal_history.py tests/test_repo_data.py tests/test_startup_stability.py tests/test_ui_wiring.py tests/test_p0_structure.py tests/test_net_rr_research.py tests/test_selection_precision.py tests/test_rsi2_selector_research.py tests/test_earnings_events.py tests/test_risk_observability.py
      - name: JavaScript syntax check
        run: node --check static/dashboard.js && node --check static/chart_guides.js && node --check static/backtest_compat.js && node --check static/paper_persistence.js && node --check static/paper_mark_to_market.js && node --check static/detail_overlay.js && node --check static/ui_controls.js && node --check static/indie_finance_ui.js && node --check static/pop_indie_polish.js && node --check static/signal_event_polish.js && node --check static/event_risk_ui.js
      - name: Deterministic strategy parity test
        run: PYTHONPATH=. python tests/test_strategy_rules.py
      - name: P0 trading structure safeguards
        run: PYTHONPATH=. python tests/test_p0_structure.py
      - name: Net RR deterministic tests
        run: PYTHONPATH=. python tests/test_net_rr_research.py
      - name: Selection threshold precision tests
        run: PYTHONPATH=. python tests/test_selection_precision.py
      - name: RSI2 selector research tests
        run: PYTHONPATH=. python tests/test_rsi2_selector_research.py
      - name: Earnings event cache and risk tests
        run: PYTHONPATH=. python tests/test_earnings_events.py
      - name: Risk observability snapshot tests
        run: PYTHONPATH=. python tests/test_risk_observability.py
      - name: Backtest V2 execution and portfolio tests
        run: PYTHONPATH=. python tests/test_backtest_v2.py
      - name: Backtrader independent audit tests
        run: PYTHONPATH=. python tests/test_backtrader_audit.py
      - name: Paper broker lifecycle tests
        run: PYTHONPATH=. python tests/test_paper_broker.py
      - name: Manual paper controls tests
        run: PYTHONPATH=. python tests/test_paper_manual.py
      - name: Automatic shadow research portfolio tests
        run: PYTHONPATH=. python tests/test_shadow_lab.py
      - name: S and elite signal-log transition tests
        run: PYTHONPATH=. python tests/test_signal_log_tiers.py
      - name: Paper mark-to-market tests
        run: PYTHONPATH=. python tests/test_paper_marks.py
      - name: Paper browser restore tests
        run: PYTHONPATH=. python tests/test_paper_restore.py
      - name: Signal history and close-publication tests
        run: PYTHONPATH=. python tests/test_signal_history.py
      - name: Render repo-data cache/fallback tests
        run: PYTHONPATH=. python tests/test_repo_data.py
      - name: Startup and deploy stability tests
        run: PYTHONPATH=. python tests/test_startup_stability.py
      - name: Detail, Backtest V2 and Paper UI regression test
        run: PYTHONPATH=. python tests/test_ui_wiring.py
      - name: Corporate-action price-basis audit
        continue-on-error: true
        run: PYTHONPATH=. python corporate_action_audit.py
      - name: Upload corporate-action audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corporate-action-audit
          path: artifacts/corporate_action_audit.json
          if-no-files-found: warn
      - name: Net RR sensitivity research
        run: PYTHONPATH=. python net_rr_research.py
      - name: Upload net RR research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-rr-sensitivity
          path: artifacts/net_rr_sensitivity.json
          if-no-files-found: warn
      - name: RSI2 live-selector research
        run: PYTHONPATH=. python rsi2_selector_research.py
      - name: Upload RSI2 selector research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi2-live-selector-research
          path: artifacts/rsi2_live_selector_research.json
          if-no-files-found: warn
      - name: Real 10y x 20 stocks x 3 strategies audit
        run: PYTHONPATH=. python audit_matrix.py
      - name: Upload real-data audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtrader-real-audit
          path: artifacts/backtrader_real_audit.json
          if-no-files-found: warn
